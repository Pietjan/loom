<fieldset data-ui="radio-group" class="grid gap-2 p-0 m-0 border-0">
  <legend class="p-0 mb-1 font-medium text-base-800 text-sm dark:text-white">Plan</legend>
  <label class="inline-flex gap-2 items-center text-base-800 text-sm cursor-pointer select-none has-[input:disabled]:cursor-not-allowed has-[input:disabled]:opacity-75 dark:text-base-100">
    <input data-ui="radio" type="radio" name="plan" value="free" class="size-4.5 bg-white rounded-full border border-base-300 shadow-xs appearance-none cursor-pointer shrink-0 dark:bg-base-700 dark:border-base-600 checked:bg-accent checked:border-transparent disabled:opacity-75 disabled:cursor-not-allowed">
    <span>Free</span>
  </label>
  <label class="inline-flex gap-2 items-center text-base-800 text-sm cursor-pointer select-none has-[input:disabled]:cursor-not-allowed has-[input:disabled]:opacity-75 dark:text-base-100">
    <input data-ui="radio" type="radio" checked name="plan" value="pro" class="size-4.5 bg-white rounded-full border border-base-300 shadow-xs appearance-none cursor-pointer shrink-0 dark:bg-base-700 dark:border-base-600 checked:bg-accent checked:border-transparent disabled:opacity-75 disabled:cursor-not-allowed">
    <span>Pro</span>
  </label>
</fieldset>
